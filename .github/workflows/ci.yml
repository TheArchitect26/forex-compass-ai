name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Compile backend app
        run: python -m compileall backend/app

      - name: Run stabilization tests
        run: PYTHONPATH=.:backend pytest -q backend/tests/test_critical_stabilization_patch.py backend/tests/test_environment_smoke.py
